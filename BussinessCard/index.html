<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;200;300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>
        Bussiness Card
    </title>
</head>

<body>
    <div class="flex flex-col items-center justify-center min-h-screen ">
        <main class="flex flex-col card rounded-xl border-transparent ">
            <div class="w-full h-1/2 rounded-3xl overflow-hidden">
                <img src="assets/hero-image.jpg" alt="bussiness card hero image" class="object-cover h-full w-full" />
                <img src="assets/white-overlay.svg" alt="curve below the image" class="curve-wave">
            </div>
            <div class="p-6 flex flex-col gap-3">
                <h2 class="text-color text-xl font-bold">Perfect solution for small business</h2>
                <p class="text-grey">Small businesses need to generate leads to grow. You can use tools like Ringy.</p>
            </div>
            <hr>
            <div class="flex items-center gap-3 p-6 ">
                <img src="assets/avatar-image-business-card.png" alt="avatar image for business card"
                    class="h-10 rounded-3xl image-border" />
                <div>
                    <h2 class="text-color text-base font-bold">Amy Burgess</h2>
                    <p class="text-grey font-normal">Customer Manger, Solution Oy</p>
                </div>

            </div>
        </main>
    </div>
</body>

</html>
