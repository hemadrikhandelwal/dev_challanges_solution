<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter</title>
     <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
</head>

<body class="flex flex-col items-center justify-center min-h-screen">
    <img src="./logo.svg" alt="logo">
    <h1 class="font-semibold">Join our newsletter</h1>
    <p class="font-normal max-w-3xl text-center">Keep up with our latest collections, exclusive deals, and special offers! We introduce a new collection every
        week, so stay tuned to snag the hottest items just for you.</p>


    <div class="max-w-lg bg-white rounded-2xl shadow-md p-6 mt-10">
        <div >
            <form class="space-y-6">
                <div>
                    <div class="mt-2">
                        <input type="email" name="email"  autocomplete="email"  placeholder="Enter your email address"
                            class="flex w-full justify-center rounded-md  px-3 py-1.5 outline-1 -outline-offset-0.10 text-center light-gray" />
                    </div>
                </div>



                <div>
                    <button type="submit"
                        class="flex w-full justify-center rounded-md btn-blue px-3 py-1.5 text-sm/6 font-semibold text-white  focus-visible:outline-2 focus-visible:outline-offset-2">Subscribe now</button>
                </div>
                <p>Your email is 100% confidential and won’t send you any spam.</p>
            </form>
        </div>
    </div>
</body>

</html>
