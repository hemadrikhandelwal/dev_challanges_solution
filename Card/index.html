<!DOCTYPE html>
<html>
    <head lang="en">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <meta charset="UTF-8" />
        <title>Card</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="flex justify-center items-center min-h-screen bg-white" >
        <div class="w-90 h-95 p-4 shadow-class shadow-lg">
            <div class="card-content">
            <img src="Cactus.jpg" alt="cactus image" class="mb-4 aspect-ratio" >
            <span class="inline-flex items-center px-3 py-1 text-sm font-medium rounded-full bg-violet-200 text-violet-800 mb-2">Design</span>
            <h1 class="font-bold text-xl">Embracing Minimalism</h1>
            <p class="mb-4 text-gray-700">From minimalist sculpture to minimalist paintings,this blog will inspire you to appreciate the beauty that lies in simplicity.</p>
            </div>
             <hr>

            <p class="p-1 text-gray-700">Annie Spratt</p>
        </div>
            
           
            
    </body>
</html>
